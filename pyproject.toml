[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "S",
]
ignore = [
    "E501",
    "S104",
    "S310",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/evaluate_retrieval.py" = ["E402"]
