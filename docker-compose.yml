services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '8080:8080'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEARCHTUBE_STORAGE=${SEARCHTUBE_STORAGE:-supabase}
      - SEARCHTUBE_AUTH_MODE=${SEARCHTUBE_AUTH_MODE:-supabase}
      - SEARCHTUBE_API_KEY_MODE=${SEARCHTUBE_API_KEY_MODE:-server}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/gemini-embedding-001}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
    env_file:
      - .env.local
    restart: unless-stopped

  queue-consumer:
    build:
      context: .
      dockerfile: Dockerfile.queue-consumer
    profiles:
      - queue
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEARCHTUBE_STORAGE=${SEARCHTUBE_STORAGE:-supabase}
      - SEARCHTUBE_AUTH_MODE=${SEARCHTUBE_AUTH_MODE:-supabase}
      - SEARCHTUBE_API_KEY_MODE=${SEARCHTUBE_API_KEY_MODE:-server}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/gemini-embedding-001}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - INGESTION_QUEUE_PULL_BATCH_SIZE=${INGESTION_QUEUE_PULL_BATCH_SIZE:-1}
      - INGESTION_QUEUE_VISIBILITY_TIMEOUT_MS=${INGESTION_QUEUE_VISIBILITY_TIMEOUT_MS:-3600000}
      - INGESTION_QUEUE_IDLE_SLEEP_SECONDS=${INGESTION_QUEUE_IDLE_SLEEP_SECONDS:-5}
      - INGESTION_QUEUE_ERROR_SLEEP_SECONDS=${INGESTION_QUEUE_ERROR_SLEEP_SECONDS:-10}
      - INGESTION_QUEUE_MAX_CONSECUTIVE_ERRORS=${INGESTION_QUEUE_MAX_CONSECUTIVE_ERRORS:-10}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_INGESTION_QUEUE_ID=${CLOUDFLARE_INGESTION_QUEUE_ID}
      - CLOUDFLARE_QUEUES_API_TOKEN=${CLOUDFLARE_QUEUES_API_TOKEN}
      - CLOUDFLARE_INGESTION_QUEUE_API_URL=${CLOUDFLARE_INGESTION_QUEUE_API_URL}
    env_file:
      - .env.local
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8080
        - VITE_AUTH_MODE=${VITE_AUTH_MODE:-supabase}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
